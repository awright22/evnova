# Fly.io host configuration for the game server.
#
# One machine with one persistent volume. The world is a single SQLite file
# and the server is authoritative over rooms held in that one process, so this
# does not scale horizontally without moving to Redis presence and a shared
# database. For a small private group it does not need to.
#
# `app` and `primary_region` are set by the owner at first deploy; see
# docs/HUMAN_TODO.md.

app = "marque"
primary_region = "iad"

# How long the host waits after SIGTERM before killing the process.
#
# `packages/server/src/main.ts` handles SIGINT and SIGTERM, flushes every
# captain and closes the database on the way out, and that is a write to a
# SQLite file plus a room shutdown. This used to be a comment on `[deploy]
# strategy`, which governs none of it — the window is this key, and it was not
# set, so whatever Fly's default is was the window. It is top-level on
# purpose: a bare key after a table header belongs to that table, and written
# further down it would have become a setting on the health check.
#
# Fly's documented default could not be checked from here — fly.io does not
# resolve through this container's network policy — which is the other reason
# to state it rather than rely on it.
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2567"
  NODE_ENV = "production"
  DATABASE_URL = "/data/marque.db"
  SNAPSHOT_DIR = "/data/snapshots"
  SNAPSHOT_KEEP = "7"

# The world lives here: the database, its write-ahead log and the daily
# snapshots. Destroying this volume destroys every account.
[[mounts]]
  source = "marque_data"
  destination = "/data"

[http_service]
  internal_port = 2567
  force_https = true
  # Never scale to zero: captains are persistent and a sleeping machine drops
  # live rooms. Never scale past one: see the note at the top.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Replace the machine in one step rather than running two at once: the world
# is one SQLite file on one volume, and a second process holding it open is
# not a state this server is written for.
[deploy]
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
