name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A later push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Fetch git dependencies over HTTPS, not SSH.
#
# Colyseus pulls in `@colyseus/uwebsockets-transport` as an optional peer, and
# that resolves `uWebSockets.js` straight from GitHub. The lockfile pins the
# SSH form, `git@github.com:uNetworking/uWebSockets.js.git`, which a runner has
# no key for — so `pnpm install` died with "Permission denied (publickey)"
# before any of these jobs ran a single test. It had done so on every push
# since this workflow was written. Git's own config-through-environment is the
# smallest fix that covers every job and every tool that shells out to git.
#
# The server imports none of this: uWebSockets is an optional peer of a
# transport we do not use. It is resolved because it is in the graph.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_0: 'git@github.com:'

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Typecheck, lint and unit tests. This is the same command used locally,
      # so a green clone means a green pipeline.
      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
          retention-days: 7

  netcode:
    name: Netcode under latency
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Prove the prediction stack still matches the server under the latency
      # the spec targets. Fails if any client's correction EMA persists, which
      # is what a determinism break looks like.
      - name: Start server with 150ms simulated latency
        run: |
          pnpm --filter @marque/server exec tsx src/main.ts &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:2567/matchmake/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
        env:
          COLYSEUS_LATENCY: '150'

      - name: Fly four bots
        run: pnpm bot --bots 4 --seconds 25 --brain wander --quiet

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/server.pid)" || true

  browsers:
    name: Two browser clients
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @marque/verify exec playwright install --with-deps chromium

      # Two real browser clients against one server, held to the network-feel
      # targets: each predicts its own hull without diverging and sees the
      # other move. The default 640x360 viewport is already the small one —
      # this comment used to claim a flag it did not pass.
      #
      # A runner gives two Chromium instances, a server and a dev preview two
      # shared cores and no GPU, and measures a 600ms round trip across a
      # 300ms link. The check reports NOT JUDGED rather than failing when the
      # machine adds more delay than the link it was asked to test; the step
      # still fails on everything that is not frame-rate-bound. Prediction
      # under latency is proven without a renderer by the soak in the job
      # below, which passes here.
      - name: Fly two browser clients
        run: pnpm verify -- --latency 150 --seconds 12

      # M3's own acceptance: the Register to flight inside a minute, and a
      # jump that lands without the view disagreeing with the server.
      - name: Open an account and take a lane
        run: pnpm verify:travel

  authority:
    name: Server authority and a six-ship fight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A client that forges positions, hits or stats must change nothing.
      - name: Verify the server's authority
        run: pnpm verify:authority

      # A hard kill must cost at most a flush interval of position and nothing
      # else: no marks, no cargo, no identity.
      - name: Verify persistence across a hard kill
        run: pnpm verify:persistence

      # A captain lands, trades, and the economic invariants hold over the
      # wire rather than only inside the pricing function.
      - name: Trade at a berth
        run: pnpm verify:trade

      # A fight is the heaviest thing a room does. The soak fails if the tick
      # leaves its budget or any client's prediction diverges.
      - name: Soak a fight
        run: pnpm sim -- --bots 6 --minutes 1.5 --latency 150 --fight
